<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f12" />
      <stop offset="100%" stop-color="#181a1f" />
    </linearGradient>
    <linearGradient id="mpWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="discGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0e0f12" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mpBg)"/>
  <circle cx="400" cy="210" r="190" fill="url(#discGlow)" />

  <!-- Player Desktop Window Mockup -->
  <rect x="140" y="55" width="520" height="340" rx="14" fill="#121316" stroke="#26282f" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="140" y="55" width="520" height="38" rx="14" fill="#181a1e" />
  <circle cx="165" cy="74" r="5" fill="#ef4444" opacity="0.7" />
  <circle cx="182" cy="74" r="5" fill="#f59e0b" opacity="0.7" />
  <circle cx="199" cy="74" r="5" fill="#10b981" opacity="0.7" />
  <text x="400" y="79" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MusicPlayer • Java (Swing + JavaFX)</text>

  <!-- Album Art / Vinyl Graphic -->
  <circle cx="250" cy="205" r="75" fill="#1b1d22" stroke="#2e313a" stroke-width="2" />
  <circle cx="250" cy="205" r="55" fill="#15171b" stroke="#272a32" stroke-width="1.5" stroke-dasharray="4 2" />
  <circle cx="250" cy="205" r="28" fill="#10b981" opacity="0.8" />
  <circle cx="250" cy="205" r="8" fill="#121316" />

  <!-- Track Info and Equalizer -->
  <text x="355" y="155" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Reproduzindo Áudio / Vídeo</text>
  <text x="355" y="180" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Suporte MP3, MP4 • yt-dlp &amp; ffmpeg</text>

  <!-- Waveform / Equalizer Bars -->
  <g transform="translate(355, 205)" fill="url(#mpWave)">
    <rect x="0" y="10" width="5" height="30" rx="2" />
    <rect x="10" y="0" width="5" height="40" rx="2" />
    <rect x="20" y="15" width="5" height="25" rx="2" />
    <rect x="30" y="5" width="5" height="35" rx="2" />
    <rect x="40" y="20" width="5" height="20" rx="2" />
    <rect x="50" y="8" width="5" height="32" rx="2" />
    <rect x="60" y="2" width="5" height="38" rx="2" />
    <rect x="70" y="18" width="5" height="22" rx="2" />
    <rect x="80" y="12" width="5" height="28" rx="2" />
    <rect x="90" y="22" width="5" height="18" rx="2" />
    <rect x="100" y="6" width="5" height="34" rx="2" />
    <rect x="110" y="14" width="5" height="26" rx="2" />
    <rect x="120" y="4" width="5" height="36" rx="2" />
    <rect x="130" y="16" width="5" height="24" rx="2" />
    <rect x="140" y="10" width="5" height="30" rx="2" />
    <rect x="150" y="20" width="5" height="20" rx="2" />
    <rect x="160" y="8" width="5" height="32" rx="2" />
    <rect x="170" y="18" width="5" height="22" rx="2" />
  </g>

  <!-- Player Progress Bar -->
  <rect x="180" y="305" width="440" height="6" rx="3" fill="#24262d" />
  <rect x="180" y="305" width="220" height="6" rx="3" fill="#10b981" />
  <circle cx="400" cy="308" r="6" fill="#f4f4f5" />

  <!-- Player Controls (Prev, Play/Pause, Next) -->
  <g transform="translate(370, 335)" fill="#f4f4f5">
    <!-- Prev -->
    <polygon points="-30,6 -20,0 -20,12" />
    <rect x="-34" y="0" width="3" height="12" />
    <!-- Play -->
    <polygon points="5,-2 23,8 5,18" />
    <!-- Next -->
    <polygon points="50,0 60,6 50,12" />
    <rect x="61" y="0" width="3" height="12" />
  </g>

  <!-- Tag / Author Note -->
  <text x="400" y="420" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Projeto em colaboração: Luiz Benevides &amp; Kaio Marques • JDK 25 &amp; JavaFX</text>
</svg>
