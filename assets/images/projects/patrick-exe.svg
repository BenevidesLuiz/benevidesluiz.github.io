<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#171226" />
    </linearGradient>
    <radialGradient id="glitchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pBg)"/>
  <circle cx="400" cy="210" r="180" fill="url(#glitchGlow)" />

  <!-- Retro CRT Scanlines & Terminal Frame -->
  <rect x="140" y="55" width="520" height="340" rx="16" fill="#0c0a17" stroke="#3730a3" stroke-width="2" />
  <rect x="150" y="65" width="500" height="320" rx="12" fill="#080711" />

  <!-- CRT Scanlines -->
  <g stroke="#1e1b4b" stroke-width="1" opacity="0.4">
    <line x1="150" y1="90" x2="650" y2="90" />
    <line x1="150" y1="120" x2="650" y2="120" />
    <line x1="150" y1="150" x2="650" y2="150" />
    <line x1="150" y1="180" x2="650" y2="180" />
    <line x1="150" y1="210" x2="650" y2="210" />
    <line x1="150" y1="240" x2="650" y2="240" />
    <line x1="150" y1="270" x2="650" y2="270" />
    <line x1="150" y1="300" x2="650" y2="300" />
    <line x1="150" y1="330" x2="650" y2="330" />
    <line x1="150" y1="360" x2="650" y2="360" />
  </g>

  <!-- Pixel art / Retro 2D Star/Creature Silhouette with Glitch Offset -->
  <g transform="translate(360, 140)">
    <!-- Red glitch offset -->
    <path d="M 40 0 L 52 28 L 82 32 L 60 52 L 66 82 L 40 68 L 14 82 L 20 52 L -2 32 L 28 28 Z" fill="#ef4444" opacity="0.4" transform="translate(-4, 0)" />
    <!-- Cyan glitch offset -->
    <path d="M 40 0 L 52 28 L 82 32 L 60 52 L 66 82 L 40 68 L 14 82 L 20 52 L -2 32 L 28 28 Z" fill="#06b6d4" opacity="0.4" transform="translate(4, 0)" />
    <!-- Main shape -->
    <path d="M 40 0 L 52 28 L 82 32 L 60 52 L 66 82 L 40 68 L 14 82 L 20 52 L -2 32 L 28 28 Z" fill="#f43f5e" />
    <!-- Eyes -->
    <circle cx="32" cy="35" r="4" fill="#ffffff" />
    <circle cx="48" cy="35" r="4" fill="#ffffff" />
    <circle cx="33" cy="35" r="2" fill="#000000" />
    <circle cx="49" cy="35" r="2" fill="#000000" />
  </g>

  <!-- Title & Metadata -->
  <text x="400" y="280" fill="#f8fafc" font-family="'Courier New', monospace" font-size="24" font-weight="700" letter-spacing="3" text-anchor="middle">patrick.exe</text>
  <text x="400" y="312" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PROJETO ACADÊMICO DE JOGO 2D</text>
  <text x="400" y="340" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Desafios de Lógica • Resolução de Problemas • 2D</text>
</svg>
