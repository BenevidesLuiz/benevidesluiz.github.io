<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="naBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>
    <radialGradient id="beamGrad" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#naBg)"/>
  
  <!-- Atmospheric light cone -->
  <polygon points="400,20 180,430 620,430" fill="url(#beamGrad)" />

  <!-- 3D Perspective Grid / Floor -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.6">
    <line x1="400" y1="220" x2="100" y2="450" />
    <line x1="400" y1="220" x2="250" y2="450" />
    <line x1="400" y1="220" x2="400" y2="450" />
    <line x1="400" y1="220" x2="550" y2="450" />
    <line x1="400" y1="220" x2="700" y2="450" />

    <line x1="280" y1="300" x2="520" y2="300" />
    <line x1="200" y1="350" x2="600" y2="350" />
    <line x1="120" y1="410" x2="680" y2="410" />
  </g>

  <!-- Solitary figure silhouette -->
  <ellipse cx="400" cy="270" rx="14" ry="14" fill="#38bdf8" opacity="0.9" />
  <path d="M 390 286 L 410 286 L 416 335 L 384 335 Z" fill="#38bdf8" opacity="0.8" />
  
  <!-- Dynamic Title -->
  <text x="400" y="140" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="4" text-anchor="middle">NOT ALONE</text>
  <text x="400" y="175" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="1" text-anchor="middle">PROJETO DE JOGO 3D • UNITY &amp; C#</text>
  <text x="400" y="430" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Desenvolvimento 3D • Exploração • Atmosfera</text>
</svg>
