<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="arkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#arkBg)"/>

  <!-- Arcade Border -->
  <rect x="180" y="45" width="440" height="350" rx="14" fill="#0b1120" stroke="#1f2937" stroke-width="2" />

  <!-- Breakout Bricks rows -->
  <!-- Row 1: Cyan -->
  <g fill="#38bdf8">
    <rect x="210" y="80" width="60" height="18" rx="3" />
    <rect x="278" y="80" width="60" height="18" rx="3" />
    <rect x="346" y="80" width="60" height="18" rx="3" />
    <rect x="414" y="80" width="60" height="18" rx="3" />
    <rect x="482" y="80" width="60" height="18" rx="3" />
    <rect x="550" y="80" width="40" height="18" rx="3" />
  </g>

  <!-- Row 2: Emerald Green -->
  <g fill="#10b981">
    <rect x="210" y="106" width="60" height="18" rx="3" />
    <rect x="278" y="106" width="60" height="18" rx="3" />
    <rect x="346" y="106" width="60" height="18" rx="3" />
    <rect x="414" y="106" width="60" height="18" rx="3" />
    <rect x="482" y="106" width="60" height="18" rx="3" />
    <rect x="550" y="106" width="40" height="18" rx="3" />
  </g>

  <!-- Row 3: Amber / Yellow -->
  <g fill="#f59e0b">
    <rect x="210" y="132" width="60" height="18" rx="3" />
    <rect x="278" y="132" width="60" height="18" rx="3" />
    <rect x="346" y="132" width="60" height="18" rx="3" />
    <rect x="414" y="132" width="60" height="18" rx="3" />
    <rect x="482" y="132" width="60" height="18" rx="3" />
    <rect x="550" y="132" width="40" height="18" rx="3" />
  </g>

  <!-- Ball trajectory & ball -->
  <path d="M 380 320 L 440 210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <circle cx="440" cy="210" r="8" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)" />

  <!-- Paddle -->
  <rect x="330" y="325" width="100" height="14" rx="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />

  <!-- Bottom Labels -->
  <text x="400" y="365" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">SUPER-ARKANOID</text>
  <text x="400" y="385" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">GameMaker • Arcade Game • Lógica e Colisão</text>
</svg>
